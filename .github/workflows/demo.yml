name: demo

# Re-record the README demo from made-up sessions (demo/seed.py) in a real
# Kitty window when the code changes, and commit the new demo/agora.gif
# straight to main; runs on other branches only upload it as an artifact. Never touches real sessions. Pushes made with GITHUB_TOKEN do not
# trigger workflows, so this cannot loop.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "demo/*.py"
      - "demo/bin/**"
      - "demo/render.sh"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # full history so the rebase onto a newer main works
      - name: Install Kitty and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kitty xvfb xdotool ffmpeg fonts-jetbrains-mono libgl1-mesa-dri
      - run: sh demo/render.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agora-demo
          path: demo/agora.gif
      - name: Commit to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/agora.gif
          git diff --cached --quiet && { echo "demo unchanged"; exit 0; }
          git commit -m "docs(demo): update recording"
          # main may have moved while recording; the demo files only change here.
          git pull --rebase origin main
          git push origin HEAD:main
