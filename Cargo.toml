[package]
name = "agora"
version = "0.6.0"
edition = "2021"
description = "One TUI for live and past Claude Code, Codex and pi sessions"
license = "MIT"
repository = "https://github.com/davegallant/agora"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
memchr = "2"
ratatui = "0.29"
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
